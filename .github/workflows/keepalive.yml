name: Supabase Keepalive Ping

# Prevent Supabase free tier projects from auto-pausing after 7 days of inactivity.
# Runs every 3 days at 00:00 UTC.

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secrets not set"
            exit 1
          fi
          
          echo "Pinging Supabase at $SUPABASE_URL..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/pid_parameters?limit=1")
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 206 ]; then
            echo "✓ Success! Supabase responded with HTTP $response"
          else
            echo "::warning::Unexpected response: HTTP $response"
            exit 1
          fi
